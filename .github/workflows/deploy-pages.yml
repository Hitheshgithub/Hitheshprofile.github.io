# .github/workflows/deploy-pages.yml

# Name of the workflow, displayed in the GitHub Actions tab.
name: Deploy to GitHub Pages

# Specifies the events that trigger this workflow.
on:
  # Runs on pushes to the 'main' branch.
  push:
    branches:
      - main
  # Allows manual triggering from the Actions tab.
  workflow_dispatch:

# Sets permissions for the GITHUB_TOKEN for this workflow run.
# This is necessary for the deploy action to authenticate and authorize correctly.
permissions:
  contents: read
  pages: write
  id-token: write

# Ensures that only one deployment runs at a time.
# If a new run is triggered while one is in progress, the in-progress run is canceled.
concurrency:
  group: "pages"
  cancel-in-progress: true

# Defines the jobs that make up the workflow.
jobs:
  # Job 1: Build the static site content.
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1.1: Checks out the repository's code.
      - name: Checkout
        uses: actions/checkout@v4

      # Step 1.2: Build your site. This is a placeholder.
      # Replace this with your actual build command (e.g., `npm run build`, `hugo`, etc.).
      # The output must be placed in a single directory for upload.
      - name: Build Static Site
        run: |
          mkdir -p _site
          echo "<h1>My GitHub Pages Site</h1>" > _site/index.html
          date >> _site/index.html

      # Step 1.3: Uploads the build output as a Pages artifact.
      # The name 'github-pages' is the default expected by the deploy action.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Specifies the directory containing the built site to upload.
          path: './_site'

  # Job 2: Deploy the artifact to GitHub Pages.
  deploy:
    # This job will only run after the 'build' job has succeeded.
    needs: build
    
    # Configures the job to run in the 'github-pages' deployment environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest
    steps:
      # Step 2.1: Deploys the previously uploaded artifact.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Timeout for the deployment in milliseconds. Your log shows 10 minutes (600,000ms).
          timeout: 600000 
          
          # Interval for polling the deployment status in milliseconds. Your log shows 5 seconds.
          reporting_interval: 5000 

          # The name of the artifact to deploy. Must match the name from the 'upload-pages-artifact' step.
          artifact_name: github-pages
